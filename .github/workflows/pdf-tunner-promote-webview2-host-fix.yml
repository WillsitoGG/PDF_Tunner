name: PDF_Tunner Promote WebView2 Validator Fix

on:
  push:
    branches:
      - pdf-tunner/webview2-host-fix-promoter

permissions:
  contents: write

jobs:
  promote-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: pdf-tunner/webview2-host-fix-promoter
          path: helper
          fetch-depth: 1

      - name: Checkout exact staging branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: pdf-tunner/webview2-fixed-v151-final-stage
          path: staging
          fetch-depth: 0

      - name: Materialize validated staging patch as ordinary blobs
        run: python helper/.github/scripts/materialize-webview2-live-patch.py staging
