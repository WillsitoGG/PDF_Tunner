name: PDF_Tunner staging validation dispatcher

on:
  push:
    branches:
      - pdf-tunner/appdata-containment-stage
    paths-ignore:
      - .github/staging-active-run-id.txt
      - .github/staging-validation-result.json
      - .github/staging-validation-log.txt
      - .github/staging-validation-artifacts.json

permissions:
  actions: write
  contents: write

jobs:
  dispatch-portable-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Dispatch heavy portable validation for this staging head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh workflow run pdf-tunner-windows-portable.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

          for attempt in $(seq 1 30); do
            run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pdf-tunner-windows-portable.yml --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 20 --json databaseId,number,headSha,status,conclusion,createdAt,url)"
            run_id="$(printf '%s' "$run_json" | jq -r --arg sha "$head_sha" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              printf '%s\n' "$run_id" > .github/staging-active-run-id.txt
              echo "Dispatched heavy validation run ID: $run_id"
              exit 0
            fi
            sleep 2
          done

          echo "Could not resolve dispatched heavy run for $head_sha" >&2
          exit 1

      - name: Record dispatched run ID on staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/staging-active-run-id.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(pdf-tunner): record active staging validation"
          git push origin HEAD:${GITHUB_REF_NAME}
