name: PDF_Tunner staging run observer

on:
  push:
    branches:
      - pdf-tunner/appdata-containment-stage
    paths-ignore:
      - .github/staging-validation-result.json
      - .github/staging-validation-log.txt
      - .github/staging-validation-artifacts.json

permissions:
  actions: read
  contents: write

jobs:
  observe-portable-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Capture completed portable run 55 diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "32659568352"
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,number,status,conclusion,headBranch,headSha,event,createdAt,updatedAt,url,jobs \
            > .github/staging-validation-result.json
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed \
            > .github/staging-validation-log.txt || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            > .github/staging-validation-artifacts.json
          echo "=== run ==="
          cat .github/staging-validation-result.json
          echo "=== failed log tail ==="
          tail -n 250 .github/staging-validation-log.txt || true
          echo "=== artifacts ==="
          cat .github/staging-validation-artifacts.json

      - name: Commit observer diagnostics to staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/staging-validation-result.json .github/staging-validation-log.txt .github/staging-validation-artifacts.json
          if git diff --cached --quiet; then
            echo "Observer diagnostics unchanged."
            exit 0
          fi
          git commit -m "ci(pdf-tunner): record staging run 55 diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
