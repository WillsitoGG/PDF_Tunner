name: PDF_Tunner WebView2 Resolver Diagnostic

on:
  push:
    branches:
      - pdf-tunner/webview2-resolver-diagnostic

concurrency:
  group: pdf-tunner-webview2-resolver-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolver-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Fixed WebView2 CAB from official Microsoft page
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '151.0.4129.101'
          $arch = 'x64'
          $pageUrl = 'https://developer.microsoft.com/en-us/microsoft-edge/webview2/?form=MA13LH#download-section'
          $output = '.github/diagnostics/webview2-resolver.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null

          $response = Invoke-WebRequest -Uri $pageUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 90
          $html = [System.Net.WebUtility]::HtmlDecode($response.Content)
          $filename = "Microsoft.WebView2.FixedVersionRuntime.$version.$arch.cab"
          $escapedFilename = [Regex]::Escape($filename)
          $urlPattern = 'https://[A-Za-z0-9._-]+/[^"''<>\s]*' + $escapedFilename + '(?:\?[^"''<>\s]*)?'
          $matches = @([Regex]::Matches($html, $urlPattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase) | ForEach-Object { $_.Value } | Select-Object -Unique)

          $lines = @(
            "PAGE=$pageUrl",
            "HTTP_STATUS=$($response.StatusCode)",
            "HTML_LENGTH=$($html.Length)",
            "TARGET_FILENAME=$filename",
            "MATCH_COUNT=$($matches.Count)"
          )

          if ($matches.Count -gt 0) {
            foreach ($candidate in $matches) {
              $lines += "CANDIDATE=$candidate"
            }
          }
          else {
            $index = $html.IndexOf($filename, [System.StringComparison]::OrdinalIgnoreCase)
            $lines += "FILENAME_INDEX=$index"
            if ($index -ge 0) {
              $start = [Math]::Max(0, $index - 700)
              $length = [Math]::Min(1400, $html.Length - $start)
              $excerpt = $html.Substring($start, $length) -replace "`r|`n", ' '
              $lines += "EXCERPT=$excerpt"
            }
          }

          Set-Content -LiteralPath $output -Encoding utf8 -Value $lines
          Get-Content -LiteralPath $output

          if ($matches.Count -ne 1) {
            throw "Expected exactly one official Fixed WebView2 CAB URL; found $($matches.Count)."
          }

          $resolved = [Uri]$matches[0]
          $allowedHosts = @(
            'msedge.sf.dl.delivery.mp.microsoft.com',
            'msedge.b.tlu.dl.delivery.mp.microsoft.com'
          )
          if ($resolved.Scheme -ne 'https' -or $allowedHosts -notcontains $resolved.Host.ToLowerInvariant()) {
            throw "Resolved URL is outside approved Microsoft Edge CDN hosts: $resolved"
          }
          if ($resolved.AbsoluteUri -match 'PA30|PA19') {
            throw "Resolved URL appears to be a delta package: $resolved"
          }

          Add-Content -LiteralPath $output -Encoding utf8 -Value "RESOLVED_CAB=$($resolved.AbsoluteUri)"

      - name: Persist resolver diagnostic on diagnostic branch
        if: always()
        shell: pwsh
        run: |
          $output = '.github/diagnostics/webview2-resolver.txt'
          if (-not (Test-Path -LiteralPath $output)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null
            Set-Content -LiteralPath $output -Encoding utf8 -Value 'ERROR=diagnostic output file was not produced.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Diagnostic content unchanged; nothing to persist.'
            exit 0
          }
          git commit -m 'chore: capture WebView2 resolver diagnostic [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
