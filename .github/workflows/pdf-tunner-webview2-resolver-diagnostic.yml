name: PDF_Tunner WebView2 Resolver Diagnostic

on:
  push:
    branches:
      - pdf-tunner/webview2-resolver-diagnostic

concurrency:
  group: pdf-tunner-webview2-resolver-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolver-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve target from official Microsoft WebView2 API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apiUrl = 'https://developer.microsoft.com/microsoft-edge/api/webview2'
          $version = '151.0.4129.101'
          $architecture = 'x64'
          $output = '.github/diagnostics/webview2-api.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null

          $response = Invoke-WebRequest -Uri $apiUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 60
          if ($response.StatusCode -ne 200) {
            throw "Official Microsoft WebView2 API returned HTTP $($response.StatusCode)."
          }
          $payload = $response.Content | ConvertFrom-Json -Depth 20
          $versions = @($payload)
          if ($payload.PSObject.Properties.Name -contains 'value') {
            $versions = @($payload.value)
          }
          $target = @($versions | Where-Object { $_.version -eq $version })
          if ($target.Count -ne 1) {
            throw "Expected exactly one WebView2 version '$version' in official API; found $($target.Count)."
          }
          $build = @($target[0].builds | Where-Object { $_.architecture -eq $architecture })
          if ($build.Count -ne 1) {
            throw "Expected exactly one '$architecture' build for WebView2 '$version'; found $($build.Count)."
          }

          $resolved = [Uri]$build[0].url
          $allowedHosts = @(
            'msedge.sf.dl.delivery.mp.microsoft.com',
            'msedge.b.tlu.dl.delivery.mp.microsoft.com'
          )
          if ($resolved.Scheme -ne 'https' -or $allowedHosts -notcontains $resolved.Host.ToLowerInvariant()) {
            throw "Resolved URL is outside approved Microsoft Edge CDN hosts: $resolved"
          }
          if ($resolved.AbsolutePath -notmatch '(?i)\.cab$') {
            throw "Resolved payload is not a CAB archive: $resolved"
          }
          if ($resolved.AbsoluteUri -match '(?i)(PA30|PA19)') {
            throw "Resolved payload appears to be a delta package: $resolved"
          }

          Set-Content -LiteralPath $output -Encoding utf8 -Value @(
            "API=$apiUrl",
            "HTTP_STATUS=$($response.StatusCode)",
            "VERSION=$version",
            "ARCHITECTURE=$architecture",
            "API_VERSION_COUNT=$($versions.Count)",
            "RESOLVED_CAB=$($resolved.AbsoluteUri)"
          )
          Get-Content -LiteralPath $output

      - name: Persist API diagnostic on diagnostic branch
        if: always()
        shell: pwsh
        run: |
          $output = '.github/diagnostics/webview2-api.txt'
          if (-not (Test-Path -LiteralPath $output)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null
            Set-Content -LiteralPath $output -Encoding utf8 -Value 'ERROR=API diagnostic output file was not produced.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Diagnostic content unchanged; nothing to persist.'
            exit 0
          }
          git commit -m 'chore: capture WebView2 API diagnostic [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
