name: PDF_Tunner WebView2 Resolver Diagnostic

on:
  push:
    branches:
      - pdf-tunner/webview2-resolver-diagnostic

concurrency:
  group: pdf-tunner-webview2-resolver-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolver-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify exact official Microsoft Fixed WebView2 CAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '151.0.4129.101'
          $architecture = 'x64'
          $cabUrl = 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/d480b710-fe1e-4e4d-ae99-5b62e6391fd3/Microsoft.WebView2.FixedVersionRuntime.151.0.4129.101.x64.cab'
          $independentExpectedSha = 'c386640d35f7a4604d088925a9bb01938400297f6da6fe985b72614daba87cda'
          $output = '.github/diagnostics/webview2-fixed-cab-verification.txt'
          $work = Join-Path $env:RUNNER_TEMP 'pdf-tunner-webview2-fixed-verify'
          $cab = Join-Path $work 'runtime.cab'
          $expanded = Join-Path $work 'expanded'
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null

          $uri = [Uri]$cabUrl
          if ($uri.Scheme -ne 'https' -or $uri.Host.ToLowerInvariant() -ne 'msedge.sf.dl.delivery.mp.microsoft.com') {
            throw "CAB URL is not the expected official Microsoft Edge CDN URL: $uri"
          }
          $expectedFilename = "Microsoft.WebView2.FixedVersionRuntime.$version.$architecture.cab"
          if ([Uri]::UnescapeDataString([IO.Path]::GetFileName($uri.AbsolutePath)) -ne $expectedFilename) {
            throw "Unexpected CAB filename: $uri"
          }

          Invoke-WebRequest -Uri $cabUrl -OutFile $cab -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 900
          $size = (Get-Item -LiteralPath $cab).Length
          if ($size -lt 100MB) {
            throw "Downloaded CAB is unexpectedly small: $size bytes."
          }
          $sha = (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $independentExpectedSha) {
            throw "SHA-256 mismatch. Calculated $sha; independently published $independentExpectedSha."
          }

          & "$env:SystemRoot\System32\expand.exe" -F:* $cab $expanded | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "expand.exe failed with exit code $LASTEXITCODE."
          }
          $executables = @(Get-ChildItem -LiteralPath $expanded -Filter 'msedgewebview2.exe' -File -Recurse)
          if ($executables.Count -lt 1) {
            throw 'The Fixed Version CAB does not contain msedgewebview2.exe.'
          }
          $versions = @($executables | ForEach-Object { $_.VersionInfo.ProductVersion } | Sort-Object -Unique)
          $matching = @($versions | Where-Object { $_ -and $_.StartsWith($version, [StringComparison]::OrdinalIgnoreCase) })
          if ($matching.Count -lt 1) {
            throw "No msedgewebview2.exe reports target version $version. Found: $($versions -join ', ')"
          }

          Set-Content -LiteralPath $output -Encoding utf8 -Value @(
            "SOURCE_URL=$cabUrl",
            "SOURCE_HOST=$($uri.Host)",
            "VERSION=$version",
            "ARCHITECTURE=$architecture",
            "CAB_SIZE_BYTES=$size",
            "SHA256=$sha",
            "INDEPENDENT_EXPECTED_SHA256=$independentExpectedSha",
            "MSEDGEWEBVIEW2_COUNT=$($executables.Count)",
            "MSEDGEWEBVIEW2_PRODUCT_VERSIONS=$($versions -join ',')",
            'RESULT=PASS'
          )
          Get-Content -LiteralPath $output
          Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue

      - name: Persist CAB verification on diagnostic branch
        if: always()
        shell: pwsh
        run: |
          $output = '.github/diagnostics/webview2-fixed-cab-verification.txt'
          if (-not (Test-Path -LiteralPath $output)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null
            Set-Content -LiteralPath $output -Encoding utf8 -Value 'ERROR=Fixed CAB verification output file was not produced.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Diagnostic content unchanged; nothing to persist.'
            exit 0
          }
          git commit -m 'chore: capture Fixed WebView2 CAB verification [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
