name: PDF_Tunner WebView2 Resolver Diagnostic

on:
  push:
    branches:
      - pdf-tunner/webview2-resolver-diagnostic

concurrency:
  group: pdf-tunner-webview2-resolver-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolver-diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve historical WebView2 CAB from Microsoft Update Catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '151.0.4129.101'
          $architecture = 'x64'
          $expectedTitle = "Microsoft Edge-WebView2 Runtime Version 151 Update for x64 based Editions (Build $version)"
          $searchUrl = "https://www.catalog.update.microsoft.com/Search.aspx?q=$([Uri]::EscapeDataString("Edge-WebView2 $architecture $version"))"
          $downloadDialogUrl = 'https://www.catalog.update.microsoft.com/DownloadDialog.aspx'
          $output = '.github/diagnostics/webview2-catalog.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null

          $search = Invoke-WebRequest -Uri $searchUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 90
          if ($search.StatusCode -ne 200) {
            throw "Microsoft Update Catalog search returned HTTP $($search.StatusCode)."
          }

          $candidates = @()
          foreach ($link in @($search.Links)) {
            if ($link.id -match '^(?<guid>[0-9a-fA-F-]{36})_link$') {
              $text = [System.Net.WebUtility]::HtmlDecode(($link.InnerText -replace '<[^>]+>', '')).Trim()
              if ($text -eq $expectedTitle) {
                $candidates += [pscustomobject]@{ Guid = $Matches.guid; Title = $text }
              }
            }
          }

          if ($candidates.Count -eq 0) {
            $pattern = '(?is)<a[^>]+id=["''](?<guid>[0-9a-fA-F-]{36})_link["''][^>]*>(?<title>.*?)</a>'
            foreach ($match in [regex]::Matches($search.Content, $pattern)) {
              $text = [System.Net.WebUtility]::HtmlDecode(($match.Groups['title'].Value -replace '<[^>]+>', '')).Trim()
              if ($text -eq $expectedTitle) {
                $candidates += [pscustomobject]@{ Guid = $match.Groups['guid'].Value; Title = $text }
              }
            }
          }

          $candidates = @($candidates | Sort-Object Guid -Unique)
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one Update Catalog entry for '$expectedTitle'; found $($candidates.Count)."
          }

          $guid = $candidates[0].Guid
          $post = @{ size = 0; updateID = $guid; uidInfo = $guid } | ConvertTo-Json -Compress
          $body = @{ updateIDs = "[$post]" }
          $dialog = Invoke-WebRequest -Uri $downloadDialogUrl -Method Post -Body $body -ContentType 'application/x-www-form-urlencoded' -UseBasicParsing -TimeoutSec 90
          if ($dialog.StatusCode -ne 200) {
            throw "Microsoft Update Catalog DownloadDialog returned HTTP $($dialog.StatusCode)."
          }

          $urlPattern = '(?i)https?://(?:dl\.delivery\.mp\.microsoft\.com|(?:catalog\.s\.)?download\.windowsupdate\.com)/[^''"<>\s]+'
          $urls = @([regex]::Matches($dialog.Content, $urlPattern) | ForEach-Object { [System.Net.WebUtility]::HtmlDecode($_.Value) } | Select-Object -Unique)
          $cabUrls = @($urls | Where-Object { ([Uri]$_).AbsolutePath -match '(?i)\.cab$' })

          Set-Content -LiteralPath $output -Encoding utf8 -Value @(
            "SEARCH=$searchUrl",
            "SEARCH_HTTP_STATUS=$($search.StatusCode)",
            "TITLE=$expectedTitle",
            "UPDATE_ID=$guid",
            "DIALOG_HTTP_STATUS=$($dialog.StatusCode)",
            "URL_COUNT=$($urls.Count)",
            "CAB_COUNT=$($cabUrls.Count)"
          )
          foreach ($url in $urls) {
            Add-Content -LiteralPath $output -Encoding utf8 -Value "DOWNLOAD_URL=$url"
          }
          Get-Content -LiteralPath $output

          if ($cabUrls.Count -lt 1) {
            throw 'No CAB URL was returned by Microsoft Update Catalog.'
          }

      - name: Persist catalog diagnostic on diagnostic branch
        if: always()
        shell: pwsh
        run: |
          $output = '.github/diagnostics/webview2-catalog.txt'
          if (-not (Test-Path -LiteralPath $output)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null
            Set-Content -LiteralPath $output -Encoding utf8 -Value 'ERROR=Catalog diagnostic output file was not produced.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $output
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Diagnostic content unchanged; nothing to persist.'
            exit 0
          }
          git commit -m 'chore: capture WebView2 catalog diagnostic [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
