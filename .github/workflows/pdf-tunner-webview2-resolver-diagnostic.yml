name: PDF_Tunner WebView2 Staging Applier

on:
  push:
    branches:
      - pdf-tunner/webview2-resolver-diagnostic

concurrency:
  group: pdf-tunner-webview2-staging-applier
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-staging-fix:
    runs-on: windows-latest
    steps:
      - name: Checkout diagnostic applier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Reuse verified staging patch with exact document EOF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflowPath = '.github/workflows/pdf-tunner-webview2-resolver-diagnostic.yml'
          $previous = (& git show "HEAD^:$workflowPath") -join "`n"
          $marker = "        run: |`n"
          $markerIndex = $previous.IndexOf($marker, [StringComparison]::Ordinal)
          if ($markerIndex -lt 0) {
            throw 'Could not recover the previous atomic staging patch body.'
          }

          $body = $previous.Substring($markerIndex + $marker.Length)
          $script = (($body -split "`n") | ForEach-Object {
            if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ }
          }) -join "`n"

          $oldReadmeWrite = 'Set-Content -LiteralPath $readmePath -Value $readme -Encoding utf8'
          $newReadmeWrite = '[System.IO.File]::WriteAllText($readmePath, $readme.TrimEnd() + "`n", [System.Text.UTF8Encoding]::new($false))'
          $oldAgentsWrite = 'Set-Content -LiteralPath $agentsPath -Value $agents -Encoding utf8'
          $newAgentsWrite = '[System.IO.File]::WriteAllText($agentsPath, $agents.TrimEnd() + "`n", [System.Text.UTF8Encoding]::new($false))'

          if (-not $script.Contains($oldReadmeWrite) -or -not $script.Contains($oldAgentsWrite)) {
            throw 'Expected README/AGENTS write statements were not found in recovered patch.'
          }
          $script = $script.Replace($oldReadmeWrite, $newReadmeWrite)
          $script = $script.Replace($oldAgentsWrite, $newAgentsWrite)

          $scriptPath = Join-Path $env:RUNNER_TEMP 'apply-webview2-staging-fix.ps1'
          [System.IO.File]::WriteAllText($scriptPath, $script.TrimEnd() + "`n", [System.Text.UTF8Encoding]::new($false))

          git fetch origin pdf-tunner/webview2-fixed-v151-final-stage
          git checkout -B pdf-tunner/webview2-fixed-v151-final-stage origin/pdf-tunner/webview2-fixed-v151-final-stage
          & $scriptPath
