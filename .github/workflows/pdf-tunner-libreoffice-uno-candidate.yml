name: PDF_Tunner LibreOffice UNO Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - pdf-tunner/libreoffice-uno-candidate
    paths:
      - '.github/workflows/pdf-tunner-libreoffice-uno-candidate.yml'
      - '.github/scripts/prepare-libreoffice-uno-candidate.ps1'
      - '.github/scripts/diagnose-libreoffice-cold-first-use.ps1'
      - '.github/scripts/validate-libreoffice-uno-candidate.ps1'
      - 'README.md'
      - 'AGENTS.md'

concurrency:
  group: pdf-tunner-libreoffice-uno-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PDF_TUNNER_LIBREOFFICE_VERSION: '26.2.5'
  PDF_TUNNER_LIBREOFFICE_MSI_URL: 'https://download.documentfoundation.org/libreoffice/stable/26.2.5/win/x86_64/LibreOffice_26.2.5_Win_x86-64.msi'
  PDF_TUNNER_LIBREOFFICE_MSI_SHA256: 'f15ba07bfcb0186986cf3171063506f5d207c11f8cc051ba0d135209e9e915f9'
  PDF_TUNNER_UNOSERVER_VERSION: '3.7'
  PDF_TUNNER_UNOSERVER_WHEEL_SHA256: 'fc44e6808071c9d2957e705ecf1742cea8a582aa5d5cc23babf36bb332ec6e8e'

jobs:
  libreoffice-uno-candidate:
    runs-on: windows-latest

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare pinned LibreOffice and unoserver payload without starting LibreOffice
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate'
          & './.github/scripts/prepare-libreoffice-uno-candidate.ps1' `
            -CandidateRoot $candidate `
            -LibreOfficeVersion $env:PDF_TUNNER_LIBREOFFICE_VERSION `
            -LibreOfficeMsiUrl $env:PDF_TUNNER_LIBREOFFICE_MSI_URL `
            -LibreOfficeMsiSha256 $env:PDF_TUNNER_LIBREOFFICE_MSI_SHA256 `
            -UnoServerVersion $env:PDF_TUNNER_UNOSERVER_VERSION `
            -UnoServerWheelSha256 $env:PDF_TUNNER_UNOSERVER_WHEEL_SHA256

      - name: Diagnose independent cold first-use path matrix
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate/PDF_Tunner'
          $evidence = Join-Path $PWD 'candidate-evidence/COLD_FIRST_USE_MATRIX.txt'
          $warmMarker = Join-Path $PWD 'candidate-evidence/WARM_UNO_ROOT.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $evidence) | Out-Null
          & './.github/scripts/diagnose-libreoffice-cold-first-use.ps1' `
            -CandidateRoot $portable `
            -LibreOfficeVersion $env:PDF_TUNNER_LIBREOFFICE_VERSION `
            -EvidencePath $evidence `
            -WarmRootMarkerPath $warmMarker

      - name: Advance real UNO conversion after controlled external warm-up
        shell: pwsh
        run: |
          $warmRoot = (Get-Content -LiteralPath (Join-Path $PWD 'candidate-evidence/WARM_UNO_ROOT.txt') -Raw).Trim()
          if (-not (Test-Path -LiteralPath $warmRoot -PathType Container)) { throw "Warm UNO diagnostic root missing: $warmRoot" }
          & './.github/scripts/validate-libreoffice-uno-candidate.ps1' `
            -CandidateRoot $warmRoot `
            -LibreOfficeVersion $env:PDF_TUNNER_LIBREOFFICE_VERSION `
            -LibreOfficeMsiSha256 $env:PDF_TUNNER_LIBREOFFICE_MSI_SHA256 `
            -UnoServerVersion $env:PDF_TUNNER_UNOSERVER_VERSION `
            -UnoServerWheelSha256 $env:PDF_TUNNER_UNOSERVER_WHEEL_SHA256 `
            -RequireUnoServer
          $unoEvidence = Join-Path $warmRoot 'data/validation-evidence/UNO_FEASIBILITY.txt'
          if (-not (Test-Path -LiteralPath $unoEvidence -PathType Leaf)) { throw "UNO evidence missing after warmed diagnostic: $unoEvidence" }
          Copy-Item -LiteralPath $unoEvidence -Destination (Join-Path $PWD 'candidate-evidence/UNO_AFTER_EXTERNAL_WARMUP.txt') -Force

      - name: Enforce cold package-local first-use acceptance
        shell: pwsh
        run: |
          $matrix = Get-Content -LiteralPath (Join-Path $PWD 'candidate-evidence/COLD_FIRST_USE_MATRIX.txt') -Raw
          if ($matrix -notmatch '(?m)^PROBE_VERSION_ALL_PACKAGE=PASS\|') {
            throw 'Cold VERSION_ALL_PACKAGE first use is still failing. Warmed UNO success is diagnostic only and does not satisfy portable acceptance.'
          }

      - name: Collect compact candidate evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'candidate-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $portable = Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate/PDF_Tunner'
          if (Test-Path -LiteralPath $portable -PathType Container) {
            $prov = Join-Path $portable 'LIBREOFFICE_UNO_PROVENANCE.txt'
            if (Test-Path -LiteralPath $prov -PathType Leaf) {
              Copy-Item -LiteralPath $prov -Destination (Join-Path $evidence 'LIBREOFFICE_UNO_PROVENANCE.txt') -Force
            }
          }

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PDF_Tunner-LibreOffice-UNO-candidate-evidence
          path: candidate-evidence
          if-no-files-found: warn
          retention-days: 7
