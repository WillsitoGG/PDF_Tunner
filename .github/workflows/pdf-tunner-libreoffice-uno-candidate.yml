name: PDF_Tunner LibreOffice UNO Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - pdf-tunner/libreoffice-uno-candidate
    paths:
      - '.github/workflows/pdf-tunner-libreoffice-uno-candidate.yml'
      - '.github/scripts/prepare-libreoffice-uno-candidate.ps1'
      - '.github/scripts/validate-libreoffice-uno-candidate.ps1'
      - 'README.md'
      - 'AGENTS.md'

concurrency:
  group: pdf-tunner-libreoffice-uno-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PDF_TUNNER_LIBREOFFICE_VERSION: '26.2.5'
  PDF_TUNNER_LIBREOFFICE_MSI_URL: 'https://download.documentfoundation.org/libreoffice/stable/26.2.5/win/x86_64/LibreOffice_26.2.5_Win_x86-64.msi'
  PDF_TUNNER_LIBREOFFICE_MSI_SHA256: 'f15ba07bfcb0186986cf3171063506f5d207c11f8cc051ba0d135209e9e915f9'
  PDF_TUNNER_UNOSERVER_VERSION: '3.7'
  PDF_TUNNER_UNOSERVER_WHEEL_SHA256: 'fc44e6808071c9d2957e705ecf1742cea8a582aa5d5cc23babf36bb332ec6e8e'

jobs:
  libreoffice-uno-candidate:
    runs-on: windows-latest

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare pinned LibreOffice and unoserver payload without starting LibreOffice
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate'
          & './.github/scripts/prepare-libreoffice-uno-candidate.ps1' `
            -CandidateRoot $candidate `
            -LibreOfficeVersion $env:PDF_TUNNER_LIBREOFFICE_VERSION `
            -LibreOfficeMsiUrl $env:PDF_TUNNER_LIBREOFFICE_MSI_URL `
            -LibreOfficeMsiSha256 $env:PDF_TUNNER_LIBREOFFICE_MSI_SHA256 `
            -UnoServerVersion $env:PDF_TUNNER_UNOSERVER_VERSION `
            -UnoServerWheelSha256 $env:PDF_TUNNER_UNOSERVER_WHEEL_SHA256

      - name: Diagnose source dependency and advance real UNO conversion
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate/PDF_Tunner'
          $relocated = Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate/PDF Tunner LibreOffice UNO Candidate - Relocated With Spaces'
          $evidenceDir = Join-Path $PWD 'candidate-evidence'
          $dependencyEvidence = Join-Path $evidenceDir 'SOURCE_DEPENDENCY.txt'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          Remove-Item -LiteralPath $relocated -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $source -Destination $relocated -Recurse -Force
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "Source candidate unexpectedly missing before dependency test: $source" }
          if (-not (Test-Path -LiteralPath $relocated -PathType Container)) { throw "Relocated candidate root was not materialized: $relocated" }

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("SOURCE=$source")
          $lines.Add("RELOCATED=$relocated")
          foreach ($entry in @(@{Name='SOURCE'; Root=$source}, @{Name='RELOCATED'; Root=$relocated})) {
            $reparse = @(Get-ChildItem -LiteralPath $entry.Root -Recurse -Force -ErrorAction SilentlyContinue | Where-Object {
              ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0
            })
            $lines.Add("$($entry.Name)_REPARSE_COUNT=$($reparse.Count)")
            foreach ($item in $reparse) {
              $relative = [System.IO.Path]::GetRelativePath($entry.Root, $item.FullName)
              $linkType = if ($item.PSObject.Properties.Name -contains 'LinkType') { [string]$item.LinkType } else { '' }
              $target = if ($item.PSObject.Properties.Name -contains 'Target') { [string]($item.Target -join ';') } else { '' }
              $lines.Add("$($entry.Name)_REPARSE=$relative|TYPE=$linkType|TARGET=$target")
            }
          }

          foreach ($entry in @(@{Name='SOURCE'; Root=$source}, @{Name='RELOCATED'; Root=$relocated})) {
            $program = Join-Path $entry.Root 'tools/libreoffice/program'
            $configFiles = @(Get-ChildItem -LiteralPath $program -File -Force -ErrorAction SilentlyContinue | Where-Object {
              $_.Extension -in @('.ini','.rc','.txt')
            })
            foreach ($config in $configFiles) {
              $relative = [System.IO.Path]::GetRelativePath($entry.Root, $config.FullName)
              $matches = @(Select-String -LiteralPath $config.FullName -SimpleMatch -Pattern $source -ErrorAction SilentlyContinue)
              if ($matches.Count -gt 0) {
                $lines.Add("$($entry.Name)_ABSOLUTE_SOURCE_REFERENCE=$relative|COUNT=$($matches.Count)")
              }
            }
          }
          $lines | Set-Content -LiteralPath $dependencyEvidence -Encoding utf8

          # First prove the copied destination can run the complete LibreOffice + PyUNO +
          # unoserver/unoconvert stack while the original tree still exists, matching
          # the successful cold-copy boundary isolated by Run #5.
          & './.github/scripts/validate-libreoffice-uno-candidate.ps1' `
            -CandidateRoot $relocated `
            -LibreOfficeVersion $env:PDF_TUNNER_LIBREOFFICE_VERSION `
            -LibreOfficeMsiSha256 $env:PDF_TUNNER_LIBREOFFICE_MSI_SHA256 `
            -UnoServerVersion $env:PDF_TUNNER_UNOSERVER_VERSION `
            -UnoServerWheelSha256 $env:PDF_TUNNER_UNOSERVER_WHEEL_SHA256 `
            -RequireUnoServer

          $firstEvidence = Join-Path $relocated 'data/validation-evidence/UNO_FEASIBILITY.txt'
          if (-not (Test-Path -LiteralPath $firstEvidence -PathType Leaf)) { throw "UNO evidence missing after source-present validation: $firstEvidence" }
          Copy-Item -LiteralPath $firstEvidence -Destination (Join-Path $evidenceDir 'UNO_WITH_SOURCE_PRESENT.txt') -Force
          Add-Content -LiteralPath $dependencyEvidence -Encoding utf8 -Value 'SOURCE_PRESENT_FULL_STACK_OK=true'

          # Then delete the original tree and repeat from fresh per-conversion workspaces.
          # If this fails, the relocated copy is not autonomous and the evidence above
          # preserves the successful source-present UNO result for diagnosis.
          Remove-Item -LiteralPath $source -Recurse -Force
          if (Test-Path -LiteralPath $source) { throw "Original candidate root still exists after dependency deletion test: $source" }
          Add-Content -LiteralPath $dependencyEvidence -Encoding utf8 -Value 'SOURCE_DELETED=true'
          Remove-Item -LiteralPath (Join-Path $relocated 'data/validation') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $relocated 'data/validation-evidence') -Recurse -Force -ErrorAction SilentlyContinue

          & './.github/scripts/validate-libreoffice-uno-candidate.ps1' `
            -CandidateRoot $relocated `
            -LibreOfficeVersion $env:PDF_TUNNER_LIBREOFFICE_VERSION `
            -LibreOfficeMsiSha256 $env:PDF_TUNNER_LIBREOFFICE_MSI_SHA256 `
            -UnoServerVersion $env:PDF_TUNNER_UNOSERVER_VERSION `
            -UnoServerWheelSha256 $env:PDF_TUNNER_UNOSERVER_WHEEL_SHA256 `
            -RequireUnoServer

          Add-Content -LiteralPath $dependencyEvidence -Encoding utf8 -Value 'SOURCE_DELETED_FULL_STACK_OK=true'

      - name: Collect compact candidate evidence
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'candidate-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $roots = @(
            (Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate/PDF_Tunner'),
            (Join-Path $env:RUNNER_TEMP 'pdf-tunner-libreoffice-uno-candidate/PDF Tunner LibreOffice UNO Candidate - Relocated With Spaces'),
            (Join-Path $env:RUNNER_TEMP 'PDF Tunner LibreOffice UNO Candidate - Relocated With Spaces')
          )
          $portable = $roots | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($portable) {
            foreach ($relative in @('LIBREOFFICE_UNO_PROVENANCE.txt', 'data/validation-evidence/UNO_FEASIBILITY.txt')) {
              $source = Join-Path $portable $relative
              if (Test-Path -LiteralPath $source) {
                Copy-Item -LiteralPath $source -Destination (Join-Path $evidence ([IO.Path]::GetFileName($source))) -Force
              }
            }
            $sofficeCom = Join-Path $portable 'tools/libreoffice/program/soffice.com'
            $sofficeExe = Join-Path $portable 'tools/libreoffice/program/soffice.exe'
            $soffice = if (Test-Path -LiteralPath $sofficeCom) { $sofficeCom } else { $sofficeExe }
            if (Test-Path -LiteralPath $soffice) {
              (& $soffice --version 2>&1) | Set-Content -LiteralPath (Join-Path $evidence 'soffice-version.txt') -Encoding utf8
            }
          }

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PDF_Tunner-LibreOffice-UNO-candidate-evidence
          path: candidate-evidence
          if-no-files-found: warn
          retention-days: 7
